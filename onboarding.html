<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obfuscator - Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
      color: #fff;
      font-family: 'Segoe UI', 'Yu Gothic UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      padding: 40px 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .content {
      padding: 40px 30px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .step h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #22c55e;
    }

    .step p {
      margin-bottom: 15px;
      color: #ccc;
      line-height: 1.7;
    }

    .step-list {
      list-style: none;
      margin-bottom: 25px;
    }

    .step-list li {
      padding: 10px 0;
      padding-left: 25px;
      position: relative;
      color: #bbb;
    }

    .step-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #22c55e;
      font-weight: bold;
      font-size: 16px;
    }

    .keyword-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .keyword-chip {
      background: #2c2c2c;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
      user-select: none;
    }

    .keyword-chip:hover {
      border-color: #22c55e;
      background: #222;
    }

    .keyword-chip.selected {
      background: #22c55e;
      border-color: #22c55e;
      color: #111;
      font-weight: 600;
    }

    .note {
      background: #222;
      border-left: 3px solid #22c55e;
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
      color: #aaa;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: #2c2c2c;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #3c3c3c;
    }

    .btn-primary {
      background: #22c55e;
      color: #111;
    }

    .btn-primary:hover {
      background: #16a34a;
    }

    .progress {
      height: 3px;
      background: #2c2c2c;
      margin-bottom: 30px;
    }

    .progress-bar {
      height: 100%;
      background: #22c55e;
      transition: width 0.3s;
    }

    .step-indicator {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Obfuscator</h1>
      <p>Screen-sharing safety setup</p>
    </div>

    <div class="content">
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="step-indicator" id="stepIndicator"></div>

      <!-- Step 1: Welcome -->
      <div class="step active" id="step-1">
        <h2 id="title-1"></h2>
        <p id="desc-1"></p>
        <ul class="step-list">
          <li id="li-1-1"></li>
          <li id="li-1-2"></li>
          <li id="li-1-3"></li>
        </ul>
        <div class="note" id="note-1"></div>
        <div class="controls">
          <button class="btn-primary" onclick="nextStep()">Next</button>
        </div>
      </div>

      <!-- Step 2: Recommended Keywords -->
      <div class="step" id="step-2">
        <h2 id="title-2"></h2>
        <p id="desc-2"></p>
        <div class="keyword-grid" id="keywordGrid"></div>
        <div class="note" id="note-2"></div>
        <div class="controls">
          <button class="btn-secondary" onclick="prevStep()">Back</button>
          <button class="btn-primary" onclick="nextStep()">Next</button>
        </div>
      </div>

      <!-- Step 3: How to Use -->
      <div class="step" id="step-3">
        <h2 id="title-3"></h2>
        <p id="desc-3"></p>
        <ul class="step-list">
          <li id="li-3-1"></li>
          <li id="li-3-2"></li>
          <li id="li-3-3"></li>
          <li id="li-3-4"></li>
        </ul>
        <div class="note" id="note-3"></div>
        <div class="controls">
          <button class="btn-secondary" onclick="prevStep()">Back</button>
          <button class="btn-primary" onclick="finish()">Finish</button>
        </div>
      </div>
    </div>
  </div>

  <script src="crypto-utils.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
